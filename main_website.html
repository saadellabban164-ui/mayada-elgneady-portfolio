<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">موقع شخصي</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            primary: 'var(--primary-color, #004aad)',
                            secondary: 'var(--secondary-color, #bb87ff)',
                            accent: 'var(--accent-color, #a8c6ff)',
                        }
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                        signature: ['Great Vibes', 'cursive']
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --primary-color: #004aad;
            --secondary-color: #bb87ff;
            --accent-color: #a8c6ff;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f6f8fe;
            color: #0c1a30;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .brand-gradient-bg { background: linear-gradient(135deg, var(--accent-color), var(--secondary-color)); }
        
        .glass-nav {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(230, 235, 255, 0.8);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) rotate(0deg) scale(1); }
            50% { transform: translateY(-25px) rotate(6deg) scale(1.05); }
        }
        .fluid-blob { animation: floatSlow 14s infinite ease-in-out; }
    </style>
</head>
<body class="relative">

    <div class="fixed top-[-10%] right-[-5%] w-[600px] h-[600px] rounded-full bg-gradient-to-br from-[var(--accent-color)]/40 to-[var(--secondary-color)]/40 blur-[120px] pointer-events-none fluid-blob -z-10 opacity-60"></div>
    <div class="fixed bottom-[-10%] left-[-5%] w-[650px] h-[650px] rounded-full bg-gradient-to-tr from-[var(--secondary-color)]/30 to-[var(--primary-color)]/15 blur-[140px] pointer-events-none fluid-blob -z-10 opacity-60" style="animation-delay: -7s;"></div>

    <header class="fixed w-full top-0 z-40 glass-nav transition-all duration-300">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            
            <a href="#home" class="flex items-center gap-3 group">
                <div id="dynamic-logo-container" class="hidden">
                    <img id="site-logo-img" src="" class="w-11 h-11 rounded-2xl object-cover shadow-md">
                </div>
                <div id="fallback-logo" class="w-11 h-11 rounded-2xl brand-gradient-bg flex items-center justify-center text-white shadow-md shadow-purple-500/10">
                    <i class="fa-solid fa-pen-nib text-xl text-white"></i>
                </div>
                
                <div class="flex flex-col">
                    <span class="text-xl font-black text-brand-primary tracking-wide leading-none" id="site-name">الاسم / الموقع</span>
                    <span class="font-signature text-brand-secondary text-lg leading-none mt-1" id="site-subtitle">المسمى</span>
                </div>
            </a>

            <nav id="dynamic-nav-links" class="hidden md:flex gap-7 items-center font-bold text-sm text-slate-700"></nav>

            <div class="flex items-center gap-3">
                <button onclick="openOrderModal()" class="hidden md:flex items-center gap-2 bg-[var(--primary-color)] text-white font-bold text-sm px-5 py-2.5 rounded-full shadow-lg hover:opacity-90 transition-transform active:scale-95">
                    <i class="fa-solid fa-paper-plane"></i> <span>اطلب تصميمك </span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow pt-28 pb-16 container mx-auto px-6 space-y-20">
        <div id="dynamic-sections-container"></div>
    </main>

    <div id="project-detail-modal" class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-4xl rounded-3xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="p-6 border-b flex justify-between items-center bg-slate-50">
                <div>
                    <span id="modal-proj-type" class="text-[10px] font-bold text-[var(--primary-color)] bg-blue-50 px-3 py-1 rounded-full uppercase"></span>
                    <h3 id="modal-proj-title" class="text-2xl font-black text-slate-900 mt-2"></h3>
                </div>
                <button onclick="closeProjectDetailModal()" class="w-10 h-10 rounded-full bg-slate-200 hover:bg-red-100 hover:text-red-600 flex items-center justify-center text-xl transition-colors"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="p-6 md:p-8 overflow-y-auto space-y-6">
                <div id="modal-client-box" class="hidden items-center gap-4 p-4 rounded-2xl bg-slate-50 border border-slate-100">
                    <div>
                        <h4 id="modal-client-name" class="font-bold text-slate-800 text-sm"></h4>
                    </div>
                </div>
                <div id="modal-gallery-container" class="space-y-4"></div>
                <div class="space-y-2">
                    <h5 class="font-bold text-slate-900 text-sm">التفاصيل:</h5>
                    <p id="modal-long-desc" class="text-slate-600 text-sm leading-relaxed whitespace-pre-line"></p>
                </div>
            </div>
        </div>
    </div>

    <div id="order-modal" class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-lg rounded-3xl shadow-2xl overflow-hidden p-8 space-y-6 relative">
            <button onclick="closeOrderModal()" class="absolute top-6 left-6 text-slate-400 hover:text-slate-700 text-xl"><i class="fa-solid fa-xmark"></i></button>

            <div class="text-center space-y-2">
                <div class="w-14 h-14 rounded-2xl bg-blue-50 text-[var(--primary-color)] flex items-center justify-center text-2xl mx-auto">
                    <i class="fa-solid fa-paper-plane"></i>
                </div>
                <h3 class="text-2xl font-black text-slate-900"> اطلب تصميمك </h3>
                <p class="text-xs text-slate-500 font-bold">أرسل تفاصيل طلبك وسنتابع معك</p>
            </div>

            <div id="order-success-msg" class="hidden bg-green-50 text-green-700 p-4 rounded-xl border border-green-200 text-center text-sm font-bold">
                <i class="fa-solid fa-circle-check text-2xl mb-2"></i><br>
                تم الإرسال بنجاح!
            </div>

            <form id="client-order-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">الاسم الكريم *</label>
                    <input type="text" id="orderClientName" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm outline-none focus:border-[var(--primary-color)]">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">البريد الإلكتروني (اختياري)</label>
                    <input type="email" id="orderClientEmail" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm outline-none focus:border-[var(--primary-color)]" dir="ltr">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">رقم الهاتف / الواتساب *</label>
                    <input type="tel" id="orderClientPhone" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm outline-none focus:border-[var(--primary-color)]" dir="ltr" placeholder="+20...">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">التفاصيل *</label>
                    <textarea id="orderClientDetails" required rows="4" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm outline-none focus:border-[var(--primary-color)]"></textarea>
                </div>
                <button type="submit" id="order-submit-btn" class="w-full py-3.5 rounded-xl bg-[var(--primary-color)] text-white font-bold text-sm shadow-lg hover:opacity-90 active:scale-95 transition-all">
                    إرسال
                </button>
            </form>
        </div>
    </div>

    <footer class="bg-white/60 backdrop-blur-md border-t border-slate-200/50 py-8 text-center text-slate-500 text-sm font-bold mt-auto">
        <p id="copyright-text">© <span id="footer-year"></span> <span id="footer-name"></span> - جميع الحقوق محفوظة</p>
    </footer>

    <script>
        document.getElementById('footer-year').innerText = new Date().getFullYear();
        let portfolioProjects = [];
        let generalData = {};
        window.firebaseProjectsOverride = null; // Flag for DB injection
        window.firebaseGeneralOverride = null;
        window.firebaseTabsOverride = null;
        window.firebaseSocialOverride = null;

        const formatText = (text) => text ? text.replace(/\n/g, '<br>') : '';

        // Mapping platform IDs to Tailwind classes and FontAwesome icons
        const platformStyles = {
            'facebook': { icon: 'fa-facebook', color: 'bg-[#1877F2] text-white', defaultName: 'فيسبوك' },
            'instagram': { icon: 'fa-instagram', color: 'bg-gradient-to-r from-purple-500 to-pink-500 text-white', defaultName: 'انستجرام' },
            'twitter': { icon: 'fa-x-twitter', color: 'bg-black text-white', defaultName: 'تويتر / X' },
            'linkedin': { icon: 'fa-linkedin', color: 'bg-[#0A66C2] text-white', defaultName: 'لينكد إن' },
            'youtube': { icon: 'fa-youtube', color: 'bg-[#FF0000] text-white', defaultName: 'يوتيوب' },
            'tiktok': { icon: 'fa-tiktok', color: 'bg-black text-white', defaultName: 'تيك توك' },
            'behance': { icon: 'fa-behance', color: 'bg-[#1769ff] text-white', defaultName: 'بيهانس' },
            'github': { icon: 'fa-github', color: 'bg-slate-900 text-white', defaultName: 'جيتهاب' },
            'link': { icon: 'fa-link', color: 'bg-slate-800 text-white', defaultName: 'رابط إضافي' }
        };

        function renderDynamicWebsite() {
            try {
                if (window.firebaseGeneralOverride) {
                    generalData = window.firebaseGeneralOverride;
                } else {
                    const genDataStr = localStorage.getItem('mayada_general_v3');
                    generalData = genDataStr ? JSON.parse(genDataStr) : {};
                }

                let menuTabs = [];
                if (window.firebaseTabsOverride) {
                    menuTabs = window.firebaseTabsOverride;
                } else {
                    const tabsStr = localStorage.getItem('mayada_menu_tabs');
                    menuTabs = tabsStr ? JSON.parse(tabsStr) : [];
                }

                if (window.firebaseProjectsOverride) {
                    portfolioProjects = window.firebaseProjectsOverride.filter(p => !p.isDeleted);
                } else {
                    const projStr = localStorage.getItem('mayada_projects');
                    const allProjects = projStr ? JSON.parse(projStr) : [];
                    portfolioProjects = allProjects.filter(p => !p.isDeleted);
                }
                
                let socialData = {};
                if (window.firebaseSocialOverride) {
                    socialData = window.firebaseSocialOverride;
                } else {
                    const socialStr = localStorage.getItem('mayada_social_v3') || localStorage.getItem('mayada_social_v2');
                    socialData = socialStr ? JSON.parse(socialStr) : {};
                }

                if (generalData.primaryColor) document.documentElement.style.setProperty('--primary-color', generalData.primaryColor);
                if (generalData.secondaryColor) document.documentElement.style.setProperty('--secondary-color', generalData.secondaryColor);
                if (generalData.accentColor) document.documentElement.style.setProperty('--accent-color', generalData.accentColor);

                const displayName = generalData.siteName || 'موقع شخصي';
                document.getElementById('site-name').innerText = displayName;
                document.getElementById('page-title').innerText = displayName;
                document.getElementById('footer-name').innerText = displayName;
                document.getElementById('site-subtitle').innerText = generalData.jobTitle || '';

                let logoSrc = generalData.logoImgUrl || generalData.logoImgBase64 || '';
                if (logoSrc) {
                    document.getElementById('site-logo-img').src = logoSrc;
                    document.getElementById('dynamic-logo-container').classList.remove('hidden');
                    document.getElementById('fallback-logo').classList.add('hidden');
                } else {
                    document.getElementById('dynamic-logo-container').classList.add('hidden');
                    document.getElementById('fallback-logo').classList.remove('hidden');
                }

                const nav = document.getElementById('dynamic-nav-links');
                nav.innerHTML = '';
                menuTabs.forEach(t => nav.innerHTML += `<a href="${t.link}" class="hover:text-[var(--primary-color)] transition-colors">${t.name}</a>`);

                const container = document.getElementById('dynamic-sections-container');
                container.innerHTML = '';

                if (generalData.heroDesc || generalData.siteName) {
                    let coverSrc = generalData.coverImgUrl || generalData.coverImgBase64 || 'https://placehold.co/600x600/e2e8f0/64748b?text=Cover+Image';
                    
                    container.innerHTML += `
                        <section id="home" class="min-h-[70vh] flex flex-col md:flex-row items-center justify-between gap-12 pt-6">
                            <div class="flex-1 space-y-6 text-center md:text-right">
                                ${generalData.jobTitle ? `<div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-[var(--secondary-color)]/20 text-[var(--primary-color)] font-bold text-xs"><i class="fa-solid fa-sparkles"></i> <span>${generalData.jobTitle}</span></div>` : ''}
                                <h1 class="text-4xl md:text-6xl font-black text-slate-900 leading-tight">${generalData.siteName || ''}</h1>
                                <p class="text-slate-600 text-lg leading-relaxed max-w-xl font-medium">${formatText(generalData.heroDesc)}</p>
                                <div class="flex flex-wrap items-center justify-center md:justify-start gap-4 pt-4">
                                    ${portfolioProjects.length > 0 ? `<a href="#work" class="bg-[var(--primary-color)] text-white px-8 py-3.5 rounded-2xl font-bold shadow-xl shadow-blue-500/20 hover:opacity-90 transition-all active:scale-95">تصفح الأعمال <i class="fa-solid fa-arrow-left mr-2"></i></a>` : ''}
                                    <button onclick="openOrderModal()" class="bg-white border-2 border-slate-200 text-slate-700 px-8 py-3.5 rounded-2xl font-bold hover:bg-slate-50 transition-all">اطلب تصميمك</button>
                            </div>
                            <div class="flex-1 w-full max-w-md relative">
                                <div class="aspect-square rounded-3xl overflow-hidden shadow-2xl glass-card p-3 relative group">
                                    <img src="${coverSrc}" class="w-full h-full object-cover rounded-2xl transition-transform duration-500 group-hover:scale-105">
                                </div>
                            </div>
                        </section>
                    `;
                }

                let aboutContent = '';
                if (generalData.aboutDesc) {
                    aboutContent += `<p class="text-slate-700 text-lg leading-relaxed font-medium mb-6">${formatText(generalData.aboutDesc)}</p>`;
                }
                
                if (generalData.dynamicFields && generalData.dynamicFields.length > 0) {
                    generalData.dynamicFields.forEach(f => {
                        let fImgSrc = f.imgUrl || f.imgBase64 || '';
                        if (f.type === 'image' && fImgSrc) {
                            aboutContent += `<div class="rounded-2xl overflow-hidden border my-4 shadow-sm"><img src="${fImgSrc}" class="w-full max-h-96 object-cover"><p class="text-xs text-center text-slate-500 p-2 font-bold bg-slate-50">${f.title || ''}</p></div>`;
                        } else if (f.type === 'quote' && f.content) {
                            aboutContent += `<blockquote class="border-r-4 border-[var(--secondary-color)] pr-4 italic text-slate-700 bg-[var(--secondary-color)]/10 p-5 rounded-xl font-bold my-4">"${formatText(f.content)}"</blockquote>`;
                        } else if (f.content || f.title) {
                            aboutContent += `<div class="my-4"><h4 class="font-bold text-slate-900 text-lg mb-2">${f.title || ''}</h4><p class="text-slate-600 text-base leading-relaxed">${formatText(f.content)}</p></div>`;
                        }
                    });
                }

                if (aboutContent) {
                    container.innerHTML += `
                        <section id="about" class="glass-card rounded-3xl p-8 md:p-12 space-y-6 my-10">
                            <div class="border-b border-slate-100 pb-4">
                                <h2 class="text-3xl font-black text-[var(--primary-color)]">نبذة عامة</h2>
                            </div>
                            ${aboutContent}
                        </section>
                    `;
                }

                if (portfolioProjects.length > 0) {
                    const categories = new Set(['الكل']);
                    portfolioProjects.forEach(p => { if (p.type) categories.add(p.type); });
                    let catButtons = '';
                    categories.forEach(cat => {
                        const isAll = cat === 'الكل';
                        catButtons += `<button onclick="window.filterProjects('${cat}')" class="cat-filter-btn px-5 py-2 rounded-full font-bold text-xs transition-all ${isAll ? 'bg-[var(--primary-color)] text-white shadow-md' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'}" data-cat="${cat}">${cat}</button>`;
                    });

                    let gridHtml = generateProjectsGridHtml(portfolioProjects);

                    container.innerHTML += `
                        <section id="work" class="space-y-8 pt-10 my-10">
                            <div class="text-center space-y-3">
                                <h2 class="text-3xl md:text-4xl font-black text-slate-900">معرض الأعمال</h2>
                            </div>
                            <div id="project-categories-container" class="flex flex-wrap items-center justify-center gap-2">${catButtons}</div>
                            <div id="projects-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">${gridHtml}</div>
                        </section>
                    `;
                }

                let socialHtml = '';
                
                if (socialData.whatsapp) {
                    let cleanWa = socialData.whatsapp.replace(/[^0-9+]/g, '');
                    socialHtml += `<a href="https://wa.me/${cleanWa}" target="_blank" class="bg-[#25D366] text-white px-6 py-3 rounded-2xl font-bold shadow-lg hover:opacity-90 flex items-center gap-2 text-sm transition-transform hover:-translate-y-1"><i class="fa-brands fa-whatsapp text-lg"></i> واتساب</a>`;
                }
                if (socialData.phone) {
                    let cleanPhone = socialData.phone.replace(/[^0-9+]/g, '');
                    socialHtml += `<a href="tel:${cleanPhone}" class="bg-blue-600 text-white px-6 py-3 rounded-2xl font-bold shadow-lg hover:opacity-90 flex items-center gap-2 text-sm transition-transform hover:-translate-y-1"><i class="fa-solid fa-phone text-lg"></i> مكالمة هاتفية</a>`;
                }
                if (socialData.email) {
                    socialHtml += `<a href="mailto:${socialData.email}" class="bg-red-500 text-white px-6 py-3 rounded-2xl font-bold shadow-lg hover:opacity-90 flex items-center gap-2 text-sm transition-transform hover:-translate-y-1"><i class="fa-solid fa-envelope text-lg"></i> بريد إلكتروني</a>`;
                }

                let customLinksToRender = socialData.customLinks || socialData.links || [];
                
                if (customLinksToRender.length > 0) {
                    customLinksToRender.forEach(link => {
                        let platformKey = link.platform || 'link'; 
                        
                        if(!link.platform) {
                            let oldName = link.name.toLowerCase();
                            if(oldName.includes('فيس')) platformKey = 'facebook';
                            else if(oldName.includes('انستا')) platformKey = 'instagram';
                            else if(oldName.includes('تويتر') || oldName.includes('x')) platformKey = 'twitter';
                            else if(oldName.includes('يوتيوب')) platformKey = 'youtube';
                            else if(oldName.includes('لينكد')) platformKey = 'linkedin';
                            else if(oldName.includes('بيهانس')) platformKey = 'behance';
                        }
                        
                        let style = platformStyles[platformKey] || platformStyles['link'];
                        let displayName = link.name || style.defaultName;
                        let href = link.url;
                        
                        if (href && !href.startsWith('http') && !href.startsWith('tel:') && !href.startsWith('mailto:')) {
                            href = 'https://' + href;
                        }

                        if(href) {
                            socialHtml += `<a href="${href}" target="_blank" class="${style.color} px-6 py-3 rounded-2xl font-bold shadow-lg hover:opacity-90 flex items-center gap-2 text-sm transition-transform hover:-translate-y-1"><i class="fa-brands ${style.icon} text-lg"></i> ${displayName}</a>`;
                        }
                    });
                }

                if (socialHtml) {
                    container.innerHTML += `
                        <section id="contact" class="text-center space-y-8 pt-6 my-10">
                            <div class="space-y-2">
                                <h2 class="text-3xl font-black text-slate-900">التواصل والروابط</h2>
                            </div>
                            <div id="social-buttons-container" class="flex flex-wrap items-center justify-center gap-4">${socialHtml}</div>
                        </section>
                    `;
                }

                if (container.innerHTML.trim() === '') {
                     container.innerHTML = `<div class="text-center py-20 text-slate-400 font-bold">الموقع قيد الإنشاء. لم يتم إضافة محتوى من لوحة التحكم بعد.</div>`;
                }

            } catch (err) { 
                console.error("Error:", err); 
            }
        }

        window.filterProjects = (category) => {
            document.querySelectorAll('.cat-filter-btn').forEach(btn => {
                btn.className = (btn.getAttribute('data-cat') === category) 
                    ? "cat-filter-btn px-5 py-2 rounded-full font-bold text-xs bg-[var(--primary-color)] text-white shadow-md transition-all"
                    : "cat-filter-btn px-5 py-2 rounded-full font-bold text-xs bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 transition-all";
            });
            const filteredList = category === 'الكل' ? portfolioProjects : portfolioProjects.filter(p => p.type === category);
            document.getElementById('projects-grid').innerHTML = generateProjectsGridHtml(filteredList);
        };

        function generateProjectsGridHtml(list) {
            if (list.length === 0) return '<p class="col-span-full text-center text-slate-400 py-12 font-bold">لا توجد مشاريع.</p>';
            let html = '';
            list.forEach(p => {
                let thumb = 'https://placehold.co/600x400/e2e8f0/64748b?text=Project';
                if (p.imageUrls && p.imageUrls.length > 0) thumb = p.imageUrls[0];
                
                html += `
                    <div onclick="openProjectDetailModal('${p.id}')" class="glass-card rounded-3xl overflow-hidden hover:shadow-2xl transition-all duration-300 cursor-pointer group flex flex-col justify-between border-slate-200">
                        <div class="h-60 overflow-hidden relative bg-slate-100">
                            <img src="${thumb}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">
                            <span class="absolute top-4 right-4 bg-slate-900/70 backdrop-blur text-white text-[10px] font-bold px-3 py-1 rounded-full uppercase">${p.type || 'عام'}</span>
                        </div>
                        <div class="p-6 flex-grow flex flex-col justify-between">
                            <div>
                                <h3 class="text-xl font-black text-slate-900 group-hover:text-[var(--primary-color)] transition-colors">${p.title}</h3>
                                <p class="text-slate-600 text-xs mt-3 line-clamp-2">${p.shortDesc || ''}</p>
                            </div>
                        </div>
                    </div>
                `;
            });
            return html;
        }

        window.openProjectDetailModal = (id) => {
            const p = portfolioProjects.find(item => item.id === id);
            if (!p) return;
            document.getElementById('modal-proj-type').innerText = p.type || 'مشروع';
            document.getElementById('modal-proj-title').innerText = p.title || '';

                onSnapshot(projectsCollection, (snapshot) => {
                    const fetchedProjects = [];

                    fetchedProjects.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                    
                    window.firebaseProjectsOverride = fetchedProjects;
                    if(typeof window.renderDynamicWebsite === 'function') {

                onSnapshot(generalDoc, (docSnap) => {

                        if(typeof window.renderDynamicWebsite === 'function') window.renderDynamicWebsite();
                    }
